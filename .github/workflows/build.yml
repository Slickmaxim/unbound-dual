name: Build PokeDaisy companion
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PokeDaisy only
        shell: bash
        run: |
          set -o pipefail
          make -C 3ds 3ds 2>&1 | tee build.log
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokedaisy-build-log
          path: build.log
          if-no-files-found: warn
      - name: Verify CIA
        run: python3 gpsp3ds/companion/test/verify_cia.py gpsp3ds/out
      - name: Check licensing notices
        run: |
          for notice in LICENSE COPYING NOTICE THIRD_PARTY_NOTICES.md; do
            test -s "gpsp3ds/out/$notice"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gpsp-pokemon-pokedaisy
          path: |
            gpsp3ds/out/gpsp-pokemon-pokedaisy.cia
            gpsp3ds/out/gpsp-pokemon-pokedaisy.3dsx
            gpsp3ds/out/LICENSE
            gpsp3ds/out/COPYING
            gpsp3ds/out/NOTICE
            gpsp3ds/out/THIRD_PARTY_NOTICES.md
